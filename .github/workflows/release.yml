name: Release

# Push a tag like v0.1.0 to build, attach the wheel, sdist and the standalone
# file to a GitHub Release. PyPI publishing is optional and disabled until a
# trusted publisher is configured (see CONTRIBUTING.md, "Releasing").

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Tag matches package version
        run: |
          VERSION=$(python -c "import capability_oriented_dsa as d; print(d.__version__)")
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${VERSION}"; exit 1; }
      - run: python tools/build_standalone.py --check
      - run: pytest
      - run: python -m build
      - name: Create the GitHub Release, or attach files to one made in the web UI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* standalone/dsa_framework.py --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* standalone/dsa_framework.py \
              --title "${GITHUB_REF_NAME}" --notes-file <(python tools/release_notes.py "${GITHUB_REF_NAME}")
          fi

