[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capability-oriented-dsa"
version = "0.3.0"
description = "Direct DSA kernels over explicit state, with an optional governed capability layer: registry dispatch, central configuration, invariant validation, metrics and structured results."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Subham Gupta", email = "subhamviky@gmail.com" }]
keywords = ["data-structures", "algorithms", "software-architecture", "explicit-state",
            "hexagonal-architecture", "template-method", "registry-pattern"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff==0.17.4",          # pinned: formatter output must match CI; Dependabot bumps it
  "mypy==2.4.1",
  "build>=1.2",
]

[project.urls]
Repository = "https://github.com/subhamviky/capability-oriented-dsa"
Documentation = "https://github.com/subhamviky/capability-oriented-dsa/tree/main/docs"
Issues = "https://github.com/subhamviky/capability-oriented-dsa/issues"
Changelog = "https://github.com/subhamviky/capability-oriented-dsa/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capability_oriented_dsa = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["capability_oriented_dsa"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["standalone/dsa_framework.py"]   # generated

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # kernels favour textbook shape over splitting
  "PLR2004",                                   # magic numbers are fine in kernels and tests
  "RUF022",                                    # __all__ is grouped by layer, not sorted
  "RUF005",                                    # list + [x] reads more like the textbook
  "UP042",                                     # keep (str, Enum): str() output is public behaviour
  "PLR0917",                                   # dataclass-style positional constructors are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415", "B018", "PT018"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
# Kernels are generic over caller-supplied comparable values.
disallow_any_explicit = false
disallow_any_generics = false
